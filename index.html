<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kamon Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, crafted, like a dyer's pattern book
   IDEA: a kamon workbench — the crest sits on the table, tools within reach, nothing scrolls
   PICTURE: the live crest, as large as the screen allows
   COLOUR and TYPE: washi off-white, sumi ink, vermilion seal, gold hairlines; Shippori Mincho + Zen Kaku Gothic New
   LAYOUT: desktop = pickers | crest | adjust+colour+meaning; phone = crest above, tabbed tool tray below */
:root{color-scheme:light dark;
--bg:light-dark(#f3eee3,#151412);--card:light-dark(#fbf8f1,#1e1c19);--ink:light-dark(#1d1b18,#ece6d8);
--mute:light-dark(#6d665b,#a39b8c);--line:light-dark(#ddd4c2,#37332d);--shu:#c8402e;--gold:#b8923f;
--sel:light-dark(#1d1b18,#ece6d8);--selink:light-dark(#fbf8f1,#151412)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:"Shippori Mincho",serif;font-weight:700;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
#root{height:100dvh}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
/* header */
.top{display:flex;align-items:center;gap:10px;padding:10px max(2.5vw,12px);border-bottom:1px solid var(--line)}
.seal{width:34px;height:34px;background:var(--shu);color:#fff7ea;display:grid;place-items:center;font:700 18px "Shippori Mincho",serif;border-radius:4px;flex:none}
.kofi svg{color:var(--ink)}
.savewrap{position:relative}
.letterrow{display:flex;align-items:center;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.lstep{display:flex;align-items:center;gap:6px}
.lnav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1}
.letterin{width:52px;height:40px;text-align:center;font-size:22px;font-weight:600;text-transform:uppercase;border:1px solid var(--line);border-radius:9px;background:var(--card);color:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 12px;min-height:36px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--selink)}
.layers{display:flex;gap:4px;margin:0 0 8px;flex-wrap:wrap}
.layers button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:0 12px;min-height:34px;font-size:12.5px}
.layers button[aria-pressed=true]{background:var(--sel);border-color:var(--sel);color:var(--selink)}
.layers .rm{margin-left:auto;color:var(--shu);border-color:transparent}
.hint{font-size:13px;color:var(--mute);margin:4px 0}
.orig{font-size:12px;color:var(--shu);margin:0 0 6px;font-weight:500}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 30px -12px rgba(0,0,0,.3);padding:6px;z-index:8;min-width:230px;display:grid}
.menu button{display:grid;text-align:left;gap:1px;border:0;background:transparent;border-radius:8px;padding:9px 12px;min-height:44px}
.menu button:hover{background:color-mix(in srgb,var(--shu) 9%,transparent)}
.menu b{font-size:14px}.menu span{font-size:12px;color:var(--mute)}
.links{display:grid;gap:6px;margin-top:12px}
.links a{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;color:var(--ink);text-decoration:none;font-size:13.5px}
.links a:hover{border-color:var(--ink)}
.links svg{color:var(--ink);flex:none}
.thanks{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:14px;box-shadow:0 18px 40px -14px rgba(0,0,0,.35);padding:14px 16px;z-index:9;animation:up .35s ease-out}
@keyframes up{from{transform:translate(-50%,16px);opacity:0}}
@media(prefers-reduced-motion:reduce){.thanks{animation:none}}
.thanks b{font-family:"Shippori Mincho",serif;font-size:17px}
.thanks p{margin:4px 0 10px;font-size:13.5px;color:var(--mute)}
.thanks .row2{display:flex;flex-wrap:wrap;gap:8px}
.thanks .btn svg{flex:none}
.thanks .btn.primary svg{color:#fff7ea}
.thanks .x{position:absolute;right:6px;top:4px;width:36px;height:36px;border:0;background:transparent;font-size:22px;color:var(--mute)}
@media(max-width:520px){.top .hide-m{display:none}}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.top h1{font-size:clamp(19px,2.4vw,24px);line-height:1;white-space:nowrap}
.by{font-size:12px;color:var(--mute);line-height:1;white-space:nowrap;text-decoration:none}
.by:hover{color:var(--shu);text-decoration:underline}
a.btn{text-decoration:none;color:inherit}
.cats{display:flex;gap:4px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:3px 10px!important}
.cats button{min-height:38px;border:1px solid var(--line);border-radius:8px;background:transparent;display:grid;place-items:center;line-height:1.1;padding:3px 2px}
.cats button span{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cats small{font-size:10px;color:var(--mute);white-space:nowrap}
.cats button[aria-selected=true]{background:var(--sel);border-color:var(--sel);color:var(--selink)}
.cats button[aria-selected=true] small{color:inherit;opacity:.75}
.top .acts{margin-left:auto;display:flex;gap:6px}
.btn{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.ink{background:var(--sel);border-color:var(--sel);color:var(--selink)}
.btn.primary{background:var(--shu);border-color:var(--shu);color:#fff7ea}
/* body grid */
.body{display:grid;min-height:0;gap:12px;padding:12px max(2.5vw,12px);
 grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto min(236px,36dvh);
 grid-template-areas:"stage" "tabs" "panel"}
.panel{grid-area:panel;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;overscroll-behavior:contain}
.panel[hidden]{display:none}
.panel h3{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel h3 em{font:400 12.5px "Zen Kaku Gothic New",sans-serif;color:var(--mute);font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{min-height:38px;border:0;border-radius:999px;background:transparent;font-size:13px;font-weight:500;color:var(--mute)}
.tabs button[aria-selected=true]{background:var(--sel);color:var(--selink)}
@media(min-width:960px) and (min-height:600px){
 .body{grid-template-columns:minmax(270px,320px) minmax(0,1fr) minmax(270px,320px);grid-template-rows:auto auto minmax(0,1fr);
  grid-template-areas:"frame stage adjust" "motif stage color" "motif stage meaning"}
 .tabs{display:none}
 .panel[hidden]{display:block}
 .p-frame{grid-area:frame}.p-motif{grid-area:motif}.p-adjust{grid-area:adjust}.p-color{grid-area:color}.p-meaning{grid-area:meaning}
 .panel{padding:14px 16px}
 .panel h3{font-size:16px}
}
/* stage */
.stage{grid-area:stage;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;min-height:0;position:relative}
.crestbox{min-height:0;display:grid;place-items:center;position:relative;touch-action:pan-y;container-type:size}
.crestbox .art{width:min(100cqw - 72px,100cqh,600px);aspect-ratio:1;display:grid}
@media(min-width:960px){.crestbox .art{width:min(100cqw - 104px,100cqh,600px)}}
.crestbox svg{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 22px rgba(40,30,10,.22))}
.crestbox.pop svg{animation:pop .4s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.95);opacity:.5}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.crestbox.pop svg{animation:none}}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%,transparent);font-size:20px;line-height:1;display:grid;place-items:center}
.nav.l{left:0}.nav.r{right:0}
.nav:hover{border-color:var(--ink)}
.namebar{display:flex;align-items:center;gap:12px;justify-content:space-between;max-width:640px;width:100%;margin:0 auto}
.name{min-width:0;flex:1}
.name .sym{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.namebar .btn{flex:none;min-height:44px}
.name .jp{font:700 clamp(18px,2.6vw,28px)/1.15 "Shippori Mincho",serif}
.name .ro{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name .sym{font-size:13px;color:var(--ink);margin-top:2px}
.name .sym b{color:var(--gold);font-weight:500}
/* pickers */
.grid{display:grid;gap:6px;grid-template-columns:repeat(6,minmax(0,1fr))}
.grid.m{grid-template-columns:repeat(5,minmax(0,1fr))}
.opt{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 3px;display:grid;justify-items:center;gap:2px;min-height:44px;transition:border-color .15s,background .15s}
.opt .th{width:100%;max-width:46px;aspect-ratio:1;display:block}
.opt .th svg{width:100%;height:100%;display:block;border-radius:5px}
.opt .lb{display:none;font-size:11.5px;line-height:1.2;text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt:hover{border-color:var(--mute)}
.opt[aria-pressed=true]{border-color:var(--shu);background:color-mix(in srgb,var(--shu) 9%,transparent);box-shadow:inset 0 0 0 1px var(--shu)}
@media(min-width:960px) and (min-height:600px){
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.m{grid-template-columns:repeat(4,minmax(0,1fr))}
 .grid.m .opt .lb{font-size:10.5px}
 .cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible}
 .cats button{padding:3px 2px!important}
 .opt .lb{display:block}.opt .th{max-width:44px}
}
@media(min-width:600px) and (max-width:959px){.opt .lb{display:block}}
/* adjust */
.row{display:grid;grid-template-columns:4.6em minmax(0,1fr) 3.4em;align-items:center;gap:8px;min-height:42px}
.row label{font-size:13px;color:var(--mute)}
.row output{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--shu);height:28px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{min-height:34px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:12.5px}
.chip:hover{border-color:var(--ink)}
/* colour */
.presets{display:grid;gap:6px;grid-template-columns:repeat(3,minmax(0,1fr))}
.preset{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 8px;border-radius:9px;border:1px solid var(--line);background:transparent;text-align:left}
.preset i{width:24px;height:24px;border-radius:50%;flex:none;border:1px solid #0002;display:grid;place-items:center}
.preset i b{width:11px;height:11px;border-radius:50%}
.preset span{font-size:12px;line-height:1.2}
.preset[aria-pressed=true]{border-color:var(--shu);box-shadow:inset 0 0 0 1px var(--shu)}
.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.color{display:flex;align-items:center;gap:8px;min-height:42px;border:1px solid var(--line);border-radius:9px;padding:3px 8px}
.color input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;flex:none}
.color span{font-size:12.5px;color:var(--mute)}
.color code{font-size:12px;margin-left:auto}
.check{display:flex;align-items:center;gap:8px;min-height:38px;font-size:13px;margin-top:4px}
.check input{width:18px;height:18px;accent-color:var(--shu)}
/* meaning */
.p-meaning{border-top:3px solid var(--gold)}
.kw{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
.kw span{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--gold)}
.p-meaning p{margin:6px 0 0;font-size:14px}
.p-meaning .lead{font-family:"Shippori Mincho",serif;font-size:16px;line-height:1.45;margin-top:0}
.p-meaning small{display:block;color:var(--mute);margin-top:10px;font-size:12px}
/* overlays */
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:9}
.modal .box{background:var(--card);border-radius:14px;padding:18px;max-width:420px;width:100%;display:grid;gap:10px;max-height:90dvh;overflow:auto}
.modal img{width:100%;border-radius:8px;border:1px solid var(--line)}
.modal p{margin:0;font-size:14px;color:var(--mute)}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--sel);color:var(--selink);padding:9px 16px;border-radius:999px;font-size:14px;z-index:10;white-space:nowrap}
@media(max-width:420px){.top h1{font-size:18px}.btn{padding:0 11px}.top .hide-s{display:none}}
@media(max-width:380px){.top .acts{gap:5px}.top .acts .btn{padding:0 9px}.top h1{font-size:17px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
{
const {useState,useEffect,useMemo,useRef,useCallback}=React;
const html=htm.bind(React.createElement);
const f=n=>+n.toFixed(2);

/* ---------- geometry ---------- */
const circ=r=>`M${r} 0A${r} ${r} 0 1 0 ${-r} 0A${r} ${r} 0 1 0 ${r} 0Z`;
const circAt=(cx,r)=>`M${cx+r} 0A${r} ${r} 0 1 0 ${cx-r} 0A${r} ${r} 0 1 0 ${cx+r} 0Z`;
const poly=pts=>'M'+pts.map(p=>p.map(f).join(' ')).join('L')+'Z';
const ngon=(n,r,a0=0)=>Array.from({length:n},(_,i)=>{const a=a0+i*2*Math.PI/n;return[r*Math.cos(a),r*Math.sin(a)]});
const octa=(h,c)=>[[-h+c,-h],[h-c,-h],[h,-h+c],[h,h-c],[h-c,h],[-h+c,h],[-h,h-c],[-h,-h+c]];
const shrink=(pts,k)=>{const cx=pts.reduce((s,p)=>s+p[0],0)/pts.length,cy=pts.reduce((s,p)=>s+p[1],0)/pts.length;return pts.map(([x,y])=>[cx+(x-cx)*k,cy+(y-cy)*k])};
const rot=(d,s)=>`<g transform="rotate(${d})">${s}</g>`;
const P='var(--p)';

/* ---------- frames ---------- */
const FRAMES=[
 {id:'none',name:'None',en:'',ro:'',jp:'',fit:1.28,d:'',inner:circ(90)},
 {id:'maru',name:'Maru',en:'Circle',ro:'Maru ni',jp:'丸に',fit:1,d:circ(95)+circ(83),inner:circ(83),
  kw:['harmony','completeness'],text:'The circle is the simplest and most familiar enclosure in Japanese heraldry — a single line that gathers the motif into a whole.'},
 {id:'futae',name:'Futae-maru',en:'Double Circle',ro:'Futae-maru ni',jp:'二重丸に',fit:.94,d:circ(95)+circ(87)+circ(83)+circ(79.5),inner:circ(79.5),
  kw:['continuity','unity'],text:'A doubled ring: a heavy outer line with a fine one inside, reading as a layered, enduring boundary.'},
 {id:'sumikiri',name:'Sumikiri-kaku',en:'Cut-corner Square',ro:'Sumikiri-kaku ni',jp:'隅切り角に',fit:1.02,d:poly(octa(90,28))+poly(octa(79,24)),inner:poly(octa(79,24)),
  kw:['order','refinement'],text:'A square with its corners trimmed away — firm and orderly, but with the hard edges softened.'},
 {id:'kikko',name:'Kikkō',en:'Tortoise Shell',ro:'Kikkō ni',jp:'亀甲に',fit:.9,d:poly(ngon(6,97))+poly(ngon(6,88))+poly(ngon(6,84))+poly(ngon(6,80.5)),inner:poly(ngon(6,80.5)),
  kw:['longevity','good fortune'],text:'The hexagon imitates the plates of a tortoise shell, an animal tied to long life. Izumo Taisha encloses its crest in a double tortoise shell; one explanation links the hexagon to Genbu, the turtle-and-snake guardian of the north.'},
 {id:'sumitate',name:'Sumitate-kaku',en:'Diamond Square',ro:'Sumitate-kaku ni',jp:'隅立て角に',fit:.8,d:poly(ngon(4,97,-Math.PI/2))+poly(ngon(4,84,-Math.PI/2)),inner:poly(ngon(4,84,-Math.PI/2)),
  kw:['balance','resolve'],text:'A square stood on its corner — the same shape as a plain square, made alert and upright.'}
];

/* ---------- motifs (fit within radius ≈ 72) ---------- */
function tomoe(){const R=70,q=24,rh=(R-q)/2,th=95*Math.PI/180,Rt=62,N=28,pt=(r,a)=>[r*Math.cos(a),r*Math.sin(a)],o=[],n=[];
 for(let i=0;i<=N;i++){const t=i/N;o.push(pt(R-(R-Rt)*t*t,th*t));n.push(pt(q+(Rt-q)*Math.pow(t,.55),th*t))}
 return 'M'+[...o,...n.reverse().slice(1)].map(p=>p.map(f).join(' ')).join('L')+`A${rh} ${rh} 0 0 1 ${R} 0Z`}
const arrow=`<path d="M0-76L-9-52L-3-55V34H3V-55L9-52Z"/><path d="M-3 26L-14 38V78L-3 66ZM3 26L14 38V78L3 66Z"/>`+
 [42,52,62].map(y=>`<path d="M-14 ${y+2}L-3 ${y-9}M14 ${y+2}L3 ${y-9}" stroke="${P}" stroke-width="1.6"/>`).join('');
const sep=`stroke="${P}" stroke-width="2.6" stroke-linejoin="round"`;
const leaf=`<path d="M0 0C34 4 42 36 0 60C-42 36-34 4 0 0Z" ${sep}/><path d="M0 8V50M0 20L-14 28M0 20L14 28M0 34L-12 42M0 34L12 42" stroke="${P}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
const bud=(y,x)=>`<path d="M${x-9} ${y+5}Q${x-10} ${y-7} ${x} ${y-10}Q${x+10} ${y-7} ${x+9} ${y+5}Q${x} ${y+1} ${x-9} ${y+5}Z" ${sep}/>`;
const stalk=(n)=>`<path d="M0 4V${-14-n*12}" stroke="currentColor" stroke-width="3.4"/>`+Array.from({length:n},(_,i)=>bud(-12-i*12,i%2?3:-3)).join('')+`<circle cy="${-18-n*12}" r="3.4"/>`;
const wring=(cx)=>`<path d="${circAt(cx,44)}${circAt(cx,33)}" fill-rule="evenodd" ${sep}/>`;
const half=(cx)=>{const a=d=>[Math.cos(d*Math.PI/180),Math.sin(d*Math.PI/180)],[c1,s1]=a(28),[c2,s2]=a(88),R=44,r=33,pt=(rr,c,s)=>`${f(cx+rr*c)} ${f(rr*s)}`;
 return `<path d="M${pt(R,c1,s1)}A${R} ${R} 0 0 1 ${pt(R,c2,s2)}L${pt(r,c2,s2)}A${r} ${r} 0 0 0 ${pt(r,c1,s1)}Z"/><path d="M${pt(R,c1,s1)}A${R} ${R} 0 0 1 ${pt(R,c2,s2)}M${pt(r,c2,s2)}A${r} ${r} 0 0 0 ${pt(r,c1,s1)}" fill="none" stroke="${P}" stroke-width="2.6"/>`};
const dia=(cx,cy,a)=>poly([[cx,cy-a],[cx+a,cy],[cx,cy+a],[cx-a,cy]]);

const feather=(px,py,a,len,w)=>{const r=a*Math.PI/180,c=Math.cos(r),s=Math.sin(r),T=(u,v)=>[px+u*c-v*s,py+u*s+v*c].map(f).join(' ');
 return `M${T(0,-w*.5)}C${T(len*.55,-w)} ${T(len*.92,-w*.7)} ${T(len,0)}C${T(len*.92,w*.7)} ${T(len*.55,w)} ${T(0,w*.5)}Z`};
const wing=(px,py,a0,a1,n,L,w)=>{let d='';for(let i=0;i<n;i++){const t=i/(n-1);d+=`<path d="${feather(px,py,a0+(a1-a0)*t,L[0]+(L[1]-L[0])*t,w)}" ${sep}/>`}

  svg:()=>{const pet=`<path d="M0-5L-27.5-43Q-29-64 0-76Q29-64 27.5-43Z"/><path d="M0-16V-48" stroke="${P}" stroke-width="2.4" stroke-linecap="round"/>`;
   return [0,72,144,216,288].map(a=>rot(a,pet)).join('')+`<circle r="6" fill="${P}"/>`},
  text:'The five pointed petals of the Chinese bellflower, a classic flower of autumn. It is associated with the Toki clan of Mino province and with Akechi Mitsuhide, who came from a branch of the Toki.'},
 {id:'ya',cat:'objects',name:'Chigai-ya',en:'Crossed Arrows',jp:'違い矢',kw:['determination','courage'],
  svg:()=>rot(-28,arrow)+rot(28,arrow),
  text:'Two arrows crossed. Arrow crests belong to the warrior tradition; an arrow flies only forward, so the image reads as resolve and a straight path.'},
 {id:'kuyo',cat:'sky',name:'Kuyō',en:'Nine Stars',jp:'九曜',kw:['guidance','heavenly order'],
  svg:()=>`<circle r="21"/>`+ngon(8,52,-Math.PI/2).map(([x,y])=>`<circle cx="${f(x)}" cy="${f(y)}" r="15.5"/>`).join(''),
  text:'Nine circles for nine heavenly bodies — sun, moon, five planets and two “shadow” stars tied to eclipses — once painted on carriages and robes for protection. Hosokawa Tadaoki is said to have received it from Oda Nobunaga, and it became the Hosokawa crest.'},
 {id:'hanabishi',cat:'flowers',name:'Hanabishi',en:'Flower Diamond',jp:'花菱',kw:['elegance','grace'],
  svg:()=>{const p=`<path d="M0-7C-16-12-26-34-14-50C-8-56-2-54 0-46C2-54 8-56 14-50C26-34 16-12 0-7Z" ${sep}/>`;

  text:'Four heart-shaped petals set in a diamond — an old court pattern. At Izumo Taisha a four-petalled flower divided by sword blades sits inside the double tortoise shell of the shrine’s crest.'},
 {id:'sakura',cat:'flowers',name:'Sakura',en:'Cherry Blossom',jp:'桜',kw:['renewal','transience'],

  text:'Five notched cherry petals. The blossoms open briefly and fall together, and Japanese poetry has long read them as an image of beauty that does not last.'},
 {id:'kiri',cat:'leaves',name:'Go-san no Kiri',en:'Paulownia',jp:'五三桐',kw:['honour','authority'],
  svg:()=>{const lf=`<path d="M0 0C20-4 32 10 30 26C28 40 14 50 0 66C-14 50-28 40-30 26C-32 10-20-4 0 0Z" ${sep}/><path d="M0 6V58M0 18L-14 26M0 18L14 26M0 32L-13 42M0 32L13 42" fill="none" stroke="${P}" stroke-width="2" stroke-linecap="round"/>`;
 const bud=(s)=>`<path d="M-6 3C-8-4-5-10 0-11C5-10 8-4 6 3C3 1-3 1-6 3Z" transform="${s}" ${sep}/>`;
 const stalk=(n,len)=>{let o=`<path d="M0 0V${-len}" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>`;
  for(let i=0;i<n;i++){const y=-10-i*(len-12)/(n-0.5),sd=i%2?1:-1;o+=bud(`translate(${sd*6.5} ${f(y)}) rotate(${sd*28})`)}
  return o+bud(`translate(0 ${-len-4})`)};
 return `<g transform="translate(0 -2)">`+
  `<g transform="translate(-6 6) rotate(64) scale(.9)">${lf}</g><g transform="translate(6 6) rotate(-64) scale(.9)">${lf}</g><g transform="translate(0 6)">${lf}</g>`+
  `<g transform="translate(-30 0) rotate(-24)">${stalk(3,42)}</g><g transform="translate(30 0) rotate(24)">${stalk(3,42)}</g><g transform="translate(0 0)">${stalk(4,60)}</g></g>`},
  text:'Three leaves beneath three flower stalks bearing 3-5-3 blossoms. Paulownia crests were once linked with the imperial court and were later used by Toyotomi Hideyoshi; a 5-7 version is today the emblem of the Japanese government.'},
 {id:'wachigai',cat:'patterns',name:'Wa-chigai',en:'Linked Rings',jp:'輪違い',kw:['bonds','partnership'],
  svg:()=>wring(-23)+wring(23)+half(-23),

 {id:'yotsume',cat:'patterns',name:'Yotsume-yui',en:'Four Eyes',jp:'四つ目結',kw:['kinship','steadfastness'],
  svg:()=>`<path fill-rule="evenodd" d="${[[0,-34],[34,0],[0,34],[-34,0]].map(([x,y])=>dia(x,y,30)+dia(x,y,12)).join('')}"/>`,
  text:'Four square “eyes” of tie-dyed cloth arranged as a diamond. The four-eye knot is the crest of the Sasaki clan of Ōmi and its branches, such as the Rokkaku.'},
 {id:'igeta',cat:'objects',name:'Igeta',en:'Well Curb',jp:'井桁',kw:['source','abundance'],

  text:'The crossed beams of a wooden well curb. A well meant a dependable source; the Sumitomo group still uses a diamond-turned well curb as its mark, explained as a symbol of a spring.'},
 {id:'guruma',cat:'objects',name:'Genji-guruma',en:'Court Wheel',jp:'源氏車',kw:['refinement','turning fortune'],
  svg:()=>`<path fill-rule="evenodd" d="${circ(71)+circ(60)+circ(17)+circ(8)}"/>`+Array.from({length:12},(_,i)=>rot(i*30,`<path d="M-2.6-16L-3.6-61H3.6L2.6-16Z"/>`)).join(''),
  text:'The wheel of a Heian courtier’s ox-cart. It is called the Genji wheel because such carts fill the painted scenes of The Tale of Genji; wheel crests recall the splendour of court life.'},
 {id:'mitsuboshi',cat:'sky',name:'Ichimonji Mitsuboshi',en:'One & Three Stars',jp:'一文字に三つ星',kw:['unity','aim'],

  text:'The character 一 (“one”) above three stars — the crest of the Mōri clan, lords of Chōshū, still seen throughout the family’s former residence in Hōfu.'},

 {id:'chidori',cat:'animals',name:'Chidori',en:'Plover',jp:'千鳥',kw:['companionship','overcoming'],

 `<path d="M-3-36Q-10-54-22-64M3-36Q10-54 22-64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="-22" cy="-64" r="3.8"/><circle cx="22" cy="-64" r="3.8"/></g>`},
  text:'A butterfly with wings spread. Because a caterpillar becomes a butterfly, it stands for transformation and rebirth. Butterfly crests were favoured by the Taira (Heike) clan, whose emblem was a swallowtail with raised wings.'},
 {id:'usagi',cat:'animals',name:'Usagi',en:'Rabbit',jp:'兎',kw:['agility','good luck'],

   `<ellipse cx="-4" cy="-50" rx="9" ry="30" transform="rotate(38 -4 -50)"/><ellipse cx="-16" cy="-52" rx="9" ry="31" transform="rotate(22 -16 -52)" ${sep}/>`+

   `<path d="M-8 36C10 30 30 30 44 38" fill="none" stroke="${P}" stroke-width="2.6" stroke-linecap="round"/></g>`,
  text:'A crouching rabbit. In Japan the shadows on the full moon are read as a rabbit pounding rice cakes, so the rabbit carries a quiet, lunar charm.'},
 {id:'tonbo',cat:'animals',name:'Tonbo',en:'Dragonfly',jp:'蜻蛉',kw:['victory','courage'],

 {id:'takanoha',cat:'animals',name:'Chigai Taka-no-ha',en:'Crossed Hawk Feathers',jp:'違い鷹の羽',kw:['valour','vigilance'],
  svg:()=>{const fe=`<path d="M0-74C22-58 24-12 18 46L0 70L-18 46C-24-12-22-58 0-74Z" ${sep}/><path d="M0-64V72" stroke="${P}" stroke-width="2.6"/>`+

 {id:'kame',cat:'animals',name:'Kame',en:'Tortoise',jp:'亀',kw:['longevity','steadiness'],

 {id:'yukiwa',cat:'sky',name:'Yukiwa',en:'Snow Ring',jp:'雪輪',kw:['purity','abundance'],
  svg:()=>{const sc=(rn,R)=>{const pts=ngon(6,rn,-Math.PI/2),c=2*rn*Math.sin(Math.PI/6),s=R-rn*Math.cos(Math.PI/6),rad=f((c*c/4+s*s)/(2*s));
    return 'M'+pts[0].map(f).join(' ')+pts.map((_,i)=>`A${rad} ${rad} 0 0 1 ${pts[(i+1)%6].map(f).join(' ')}`).join('')+'Z'};

  text:'The outline of a snowflake softened into six scallops, a pattern found in Japanese design since the Heian period. Snow was believed to bring a rich harvest, so the snow ring is an auspicious sign.'},
 {id:'mikazuki',cat:'sky',name:'Mikazuki',en:'Crescent Moon',jp:'三日月',kw:['serenity','new beginnings'],

 {id:'fuji',cat:'sky',name:'Fuji',en:'Mount Fuji',jp:'富士',kw:['aspiration','steadfastness'],

  text:'An opened folding fan. Its shape is called suehiro, “widening toward the end”, because it spreads outward from the pivot — a classic sign of a future that grows and prospers.'},
 {id:'fundo',cat:'objects',name:'Fundō',en:'Balance Weight',jp:'分銅',kw:['fairness','wealth'],

 {id:'kashiwa',cat:'leaves',name:'Mitsu-gashiwa',en:'Three Oak Leaves',jp:'三つ柏',kw:['family continuity','prosperity'],

 {id:'karigane',cat:'animals',name:'Karigane',en:'Wild Goose',jp:'雁金',kw:['seasons','messages'],

 {id:'tsuru',cat:'animals',name:'Tsuru',en:'Crane',jp:'鶴',kw:['longevity','grace'],

 const opt=(key,x,svg,label)=>html`<button key=${x.id} class="opt" aria-pressed=${s[key]===x.id} title=${label} aria-label=${label} onClick=${()=>set(key==='motif'?{motif:x.id,rot:upr(x.id,s.rot)}:key==='m2'?{m2:x.id,r2:upr(x.id,s.r2||0),...(s.m2?{}:{s2:45,x2:0,y2:0})}:{[key]:x.id})}>
   <span class="th" dangerouslySetInnerHTML=${{__html:svg}}></span><span class="lb">${x.name}</span></button>`;
 const hid=id=>tab!==id;

 return html`<div class="app">
  <header class="top">
   <div class="seal" aria-hidden="true">紋</div><div class="brand"><h1>Kamon Maker</h1><a class="by" href="https://www.youtube.com/@mono_Japan" target="_blank" rel="noopener">by mono Japan</a></div>
   <div class="acts">
    <a class="btn kofi" href="https://ko-fi.com/monojapan" target="_blank" rel="noopener" aria-label="Support mono Japan on Ko-fi"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 6h14v7a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V6zm14 1h1.5a3 3 0 0 1 0 6H17v-2h1.5a1 1 0 0 0 0-2H17V7z"/><path fill="#ff5e5b" d="M10 9.2c.9-1.2 2.9-.6 2.6 1-.2 1.1-1.6 2-2.6 2.6-1-.6-2.4-1.5-2.6-2.6-.3-1.6 1.7-2.2 2.6-1z"/></svg><span class="hide-s">Support</span></a>
    <a class="btn yt" href="https://www.youtube.com/@mono_Japan" target="_blank" rel="noopener" aria-label="mono Japan on YouTube"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#e62117" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8z"/><path fill="#fff" d="M9.8 15.1V8.9l5.4 3.1z"/></svg><span class="hide-m">YouTube</span></a>
    <div class="savewrap"><button class="btn" aria-haspopup="menu" aria-expanded=${smenu} aria-label="Share your crest" onClick=${e=>{e.stopPropagation();setMenu(false);setSmenu(m=>!m)}}><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span class="hide-s">Share</span></button>
     ${smenu&&html`<div class="menu" role="menu"><button role="menuitem" onClick=${()=>{setSmenu(false);copyLink()}}><b>Copy link</b><span>Anyone who opens it sees this crest</span></button><button role="menuitem" onClick=${()=>{setSmenu(false);postX()}}><b>Post on X</b><span>Share with a link to your crest</span></button>${typeof navigator!=='undefined'&&navigator.share&&html`<button role="menuitem" onClick=${()=>{setSmenu(false);nativeShare()}}><b>More…</b><span>Instagram, LINE, Messages and others</span></button>`}</div>`}</div>
    <div class="savewrap"><button class="btn ink" aria-haspopup="menu" aria-expanded=${menu} onClick=${e=>{e.stopPropagation();setSmenu(false);setMenu(m=>!m)}}>Save<span aria-hidden="true">▾</span></button>
     ${menu&&html`<div class="menu" role="menu"><button role="menuitem" onClick=${()=>{setMenu(false);savePNG()}}><b>PNG</b><span>1024 × 1024 · for icons & social</span></button><button role="menuitem" onClick=${()=>{setMenu(false);saveSVG()}}><b>SVG</b><span>Vector · scales to any size</span></button></div>`}</div>
   </div>
  </header>
  <main class="body">
   <section class="stage" aria-label="Your crest">
    <div class=${'crestbox'+(pop?' pop':'')} key=${pop} onTouchStart=${onTS} onTouchEnd=${onTE}>
     <div class="art" role="img" aria-label=${`${fr.ro} ${mo.name}`} dangerouslySetInnerHTML=${{__html:preview}}></div>
     <button class="nav l" aria-label="Previous motif" onClick=${()=>step('motif',MOTIFS,-1)}>‹</button>
     <button class="nav r" aria-label="Next motif" onClick=${()=>step('motif',MOTIFS,1)}>›</button>
    </div>
    <div class="namebar">
     <div class="name"><div class="jp">${fr.jp}${mo.jp}</div>
      <div class="ro">${fr.ro} ${mo.name} · ${fr.id!=='none'?fr.en+' with ':''}${mo.en}</div>
      <div class="sym">Symbolizes <b>${andList(kws)}</b></div></div>
     <button class="btn primary" onClick=${randomize}>⟳ Randomize</button>
    </div>
   </section>

   <nav class="tabs" role="tablist">${TABS.map(([id,l])=>html`<button key=${id} role="tab" aria-selected=${tab===id} onClick=${()=>setTab(id)}>${l}</button>`)}</nav>

   <section class="panel p-frame" hidden=${hid('frame')}><h3>Outer frame <em>${fr.name}${fr.en?' · '+fr.en:''}</em></h3>
    <div class="grid">${FRAMES.map(x=>opt('frame',x,buildSVG({...thumbS,frame:x.id},{size:46,frameOnly:x.id!=='none'}),x.name+(x.en?' — '+x.en:'')))}</div></section>

   <section class="panel p-motif" hidden=${hid('motif')}><h3>Center motif <em>${layer==='main'?mA.name+' · '+mA.en:mB?mB.name+' · '+mB.en:'Pick a second motif'}</em></h3>
    <div class="layers" role="group" aria-label="Which motif to edit"><button aria-pressed=${layer==='main'} onClick=${()=>setLayer('main')}>Main motif</button><button aria-pressed=${layer==='second'} onClick=${()=>setLayer('second')}>${s.m2?'Second motif':'+ Add a second'}</button>${layer==='second'&&s.m2&&html`<button class="rm" onClick=${()=>{set({m2:''});setLayer('main')}}>Remove</button>`}</div>
    ${(layer==='main'?s.motif:s.m2)==='initial'&&html`<div class="letterrow"><div class="lstep"><button class="lnav" aria-label="Previous letter" onClick=${()=>set({letter:String.fromCharCode((s.letter.charCodeAt(0)-65+25)%26+65)})}>‹</button><input class="letterin" value=${s.letter} autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your letter, A to Z — tap and type" onFocus=${e=>{try{e.target.select()}catch(_){}}} onInput=${e=>{const v=(e.target.value||'').toUpperCase().replace(/[^A-Z]/g,'').slice(-1);if(v)set({letter:v});e.target.value=v||s.letter}}/><button class="lnav" aria-label="Next letter" onClick=${()=>set({letter:String.fromCharCode((s.letter.charCodeAt(0)-65+1)%26+65)})}>›</button></div><div class="seg" role="group" aria-label="Letter style">${[['brush','Brush 筆'],['inlay','Inlay'],['solid','Solid']].map(([k,t])=>html`<button key=${k} aria-pressed=${(s.lstyle||'brush')===k} onClick=${()=>set({lstyle:k})}>${t}</button>`)}</div></div>`}
    <div class="cats" role="tablist" aria-label="Motif categories">${CATS.map(([id,l,j])=>html`<button key=${id} role="tab" aria-selected=${cat===id} onClick=${()=>setCat(id)}><span>${l}</span><small>${j}</small></button>`)}</div>
    <div class="grid m">${MOTIFS.filter(x=>x.cat===cat).map(x=>opt(layer==='main'?'motif':'m2',x,buildSVG({...thumbS,motif:x.id},{size:46,motifOnly:true}),x.name+' — '+x.en))}</div></section>

   <section class="panel p-adjust" hidden=${hid('adjust')}><h3>Size & position</h3>
    <div class="layers" role="group" aria-label="Which motif to adjust"><button aria-pressed=${layer==='main'} onClick=${()=>setLayer('main')}>Main motif</button><button aria-pressed=${layer==='second'} onClick=${()=>setLayer('second')}>Second motif</button></div>
    ${layer==='second'&&!s.m2?html`<p class="hint">Open the <b>Motif</b> tab, choose <b>+ Add a second</b>, and pick a motif to combine.</p>`:(()=>{const k=layer==='main'?{sz:'size',rt:'rot',x:'dx',y:'dy',min:50,max:140,lim:40}:{sz:'s2',rt:'r2',x:'x2',y:'y2',min:20,max:100,lim:60};return html`
    <div class="row"><label for="sz">Size</label><input id="sz" type="range" min=${k.min} max=${k.max} step="1" value=${s[k.sz]} onInput=${e=>set({[k.sz]:+e.target.value})}/><output>${s[k.sz]}%</output></div>
    <div class="row"><label for="rt">Rotation</label><input id="rt" type="range" min="0" max="360" step="1" value=${s[k.rt]} onInput=${e=>set({[k.rt]:+e.target.value})}/><output>${s[k.rt]}°</output></div>
    <div class="row"><label for="mx">Left · Right</label><input id="mx" type="range" min=${-k.lim} max=${k.lim} step="1" value=${s[k.x]} onInput=${e=>set({[k.x]:+e.target.value})}/><output>${s[k.x]}</output></div>
    <div class="row"><label for="my">Up · Down</label><input id="my" type="range" min=${-k.lim} max=${k.lim} step="1" value=${s[k.y]} onInput=${e=>set({[k.y]:+e.target.value})}/><output>${s[k.y]}</output></div>
    <div class="quick">${[0,45,90,180].map(a=>html`<button key=${a} class="chip" onClick=${()=>set({[k.rt]:a})}>${a}°</button>`)}<button class="chip" onClick=${()=>set(layer==='main'?{size:100,rot:0,dx:0,dy:0}:{s2:45,r2:0,x2:0,y2:0})}>Reset</button></div>`})()}
   </section>

   <section class="panel p-color" hidden=${hid('color')}><h3>Traditional colours</h3>
    <div class="presets">${PRESETS.map(p=>html`<button key=${p.id} class="preset" aria-pressed=${s.preset===p.id} onClick=${()=>set({ink:p.ink,paper:p.paper,preset:p.id})}>
     <i style=${{background:p.paper}}><b style=${{background:p.ink}}></b></i><span>${p.name}</span></button>`)}</div>
    <div class="colors">
     <label class="color"><input type="color" value=${s.ink} onInput=${e=>set({ink:e.target.value,preset:''})}/><span>Crest</span><code>${s.ink}</code></label>
     <label class="color"><input type="color" value=${s.paper} onInput=${e=>set({paper:e.target.value,preset:''})}/><span>Ground</span><code>${s.paper}</code></label>
    </div>
    <label class="check"><input type="checkbox" checked=${s.transparent} onChange=${e=>set({transparent:e.target.checked})}/>Transparent ground in downloads</label>
   </section>

   <section class="panel p-meaning" hidden=${hid('meaning')} aria-live="polite"><h3>Meaning & origin</h3>
    <div class="kw">${kws.map(k=>html`<span key=${k}>${k}</span>`)}</div>
    <p class="lead">${fr.id==='none'?`Unframed, the ${mo.en.toLowerCase()} speaks directly.`:`The ${fr.en.toLowerCase()} gathers the ${mo.en.toLowerCase()} into one emblem: ${mo.kw[0]} held within ${fr.kw[0]}.`}</p>
    ${mo.orig&&html`<p class="orig">✦ Original design — a Kamon Maker creation, not a traditional family crest.</p>`}<p><b>${mA.name} · ${mA.jp}.</b> ${mA.text}</p>${mB&&html`<p><b>${mB.name} · ${mB.jp}.</b> ${mB.text}</p>`}
    ${fr.id!=='none'&&html`<p><b>${fr.name} · ${fr.jp.replace('に','')}.</b> ${fr.text}</p>`}
    <div class="links"><a href="https://youtu.be/bn1kcLV0_m4" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#e62117" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8z"/><path fill="#fff" d="M9.8 15.1V8.9l5.4 3.1z"/></svg><span>Watch our film on kamon</span></a><a href="https://ko-fi.com/monojapan" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 6h14v7a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V6zm14 1h1.5a3 3 0 0 1 0 6H17v-2h1.5a1 1 0 0 0 0-2H17V7z"/><path fill="#ff5e5b" d="M10 9.2c.9-1.2 2.9-.6 2.6 1-.2 1.1-1.6 2-2.6 2.6-1-.6-2.4-1.5-2.6-2.6-.3-1.6 1.7-2.2 2.6-1z"/></svg><span>Support mono Japan on Ko-fi</span></a></div>
    <small>Symbolic readings are traditional associations, not fixed rules. Your crest is an original design, not a registered family mon.</small>
   </section>
  </main>

  ${modal&&html`<div class="modal" onClick=${e=>{if(e.target===e.currentTarget)setModal(null)}}><div class="box">
   <h3>${modal.type==='png'?'Save your PNG':modal.type==='link'?'Share link':'Your SVG'}</h3>
   ${modal.type==='link'?html`<input readonly style=${{width:'100%',font:'13px monospace',borderRadius:'8px',padding:'10px',border:'1px solid var(--line)'}} value=${modal.url} onFocus=${e=>e.target.select()}/><p>Copy this link and paste it anywhere.</p>`:modal.type==='png'?html`<img src=${modal.src} alt="Your crest, 1024 by 1024 PNG"/><p>Downloads aren’t available in this view. Long-press (phone) or right-click (desktop) the image to save it.</p>`
    :html`<textarea readonly style=${{width:'100%',height:'160px',font:'12px monospace',borderRadius:'8px',padding:'8px'}} value=${modal.text}></textarea><button class="btn ink" onClick=${()=>copySVG(modal.text)}>Copy SVG code</button>`}
   <button class="btn" onClick=${()=>setModal(null)}>Close</button></div></div>`}
  ${thanks&&html`<aside class="thanks" role="dialog" aria-label="Thank you"><button class="x" aria-label="Close" onClick=${()=>setThanks(false)}>×</button>
   <b>Your crest is saved.</b><p>Kamon Maker is free, made by one person behind <i>mono Japan</i>, a documentary channel on Japanese culture.</p>
   <div class="row2"><a class="btn" href="https://youtu.be/bn1kcLV0_m4" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#e62117" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8z"/><path fill="#fff" d="M9.8 15.1V8.9l5.4 3.1z"/></svg>Watch the kamon film</a><a class="btn primary" href="https://ko-fi.com/monojapan" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 6h14v7a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V6zm14 1h1.5a3 3 0 0 1 0 6H17v-2h1.5a1 1 0 0 0 0-2H17V7z"/><path fill="#ff5e5b" d="M10 9.2c.9-1.2 2.9-.6 2.6 1-.2 1.1-1.6 2-2.6 2.6-1-.6-2.4-1.5-2.6-2.6-.3-1.6 1.7-2.2 2.6-1z"/></svg>Support on Ko-fi</a></div></aside>`}
  ${toast&&html`<div class="toast" role="status">${toast}</div>`}
 </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
}
</script>
</body>
